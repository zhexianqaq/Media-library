name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送取消旧任务，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

jobs:
  # 校验 gradle-wrapper.jar 未被篡改（供应链安全）
  wrapper:
    name: 校验 Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: 构建 Debug + Release
    runs-on: ubuntu-latest
    needs: wrapper
    env:
      # 未配置 Secret 时为空字符串，构建脚本会自动跳过签名，产出未签名 APK
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 恢复签名密钥
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/douyingallery.jks
          echo "已从 Secret 恢复 keystore（$(stat -c%s app/douyingallery.jks) 字节）"

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 构建 APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: 检查产物与签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "未生成 release APK"; exit 1; fi
          echo "产物: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if "$BT/apksigner" verify --verbose "$APK" > /dev/null 2>&1; then
            echo "release APK 已签名"
            "$BT/apksigner" verify --print-certs "$APK" | head -5
          else
            echo "::warning::release APK 未签名（未配置 ANDROID_KEYSTORE_BASE64）"
          fi
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|uses-permission"

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

  # 打 v* 标签时自动建 Release 并挂上 APK
  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: out

      - name: 重命名产物
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          for f in out/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .apk)                    # app-release / app-release-unsigned / app-debug
            case "$base" in
              app-debug)             name="douyin-gallery-${TAG}-debug.apk" ;;
              app-release)           name="douyin-gallery-${TAG}-release.apk" ;;
              app-release-unsigned)  name="douyin-gallery-${TAG}-release-unsigned.apk" ;;
              *)                     name="douyin-gallery-${TAG}-${base#app-}.apk" ;;
            esac
            cp "$f" "dist/$name"
          done
          ls -lh dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ## 安装

            1. 下载 `*-release.apk`，在手机上点击安装（需允许「安装未知来源应用」）。
            2. 首次启动授予「所有文件访问权限」，应用会自动扫描 `内部存储/抖音解析/`。
            3. 想改扫描目录：设置 → 根目录。

            > release 包与历史版本签名一致，可直接覆盖安装升级（请勿卸载，卸载会丢收藏与播放进度）。
            > `*-debug.apk` 用于测试，包名带 `.debug` 后缀，可与正式包共存。

            ## 完整说明

            见 [README](https://github.com/${{ github.repository }}#readme)。
